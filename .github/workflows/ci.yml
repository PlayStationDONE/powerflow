name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./build.sh

      - name: Check the bundle is complete
        run: |
          test -x build/PowerFlow.app/Contents/MacOS/PowerFlow
          test -f build/PowerFlow.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/PowerFlow.app/Contents/Info.plist
